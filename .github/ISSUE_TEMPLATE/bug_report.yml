name: Bug report
description: Something in api-drift doesn't work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is for the `api-drift` CLI itself — not for a partner API
        that changed shape. api-drift reporting that drift is the tool
        working.

  - type: input
    id: version
    attributes:
      label: api-drift version
      description: >
        From `npm ls -g api-drift`, `npm ls api-drift`, or the version you
        ran with npx.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node -v`. CI tests 22.x and 24.x.
      placeholder: "v22.11.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: dropdown
    id: command
    attributes:
      label: Command
      options:
        - record
        - check
        - show
    validations:
      required: true

  - type: textarea
    id: exact-command
    attributes:
      label: Exact command
      description: The full command you ran. Redact any URL, header, or secret you can't share.
      render: shell
      placeholder: |
        api-drift check --name orders --source https://api.example.com/orders
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Full console output or error message, if you can share it.
      render: shell
    validations:
      required: true

  - type: textarea
    id: baseline
    attributes:
      label: The relevant baseline entry
      description: >
        The entry for this endpoint from your api-drift.json (the `shape`
        block, not the live response). It contains no response data, only
        field names and types.
    validations:
      required: false
